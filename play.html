const brain=(m='happy',w=130)=>{const mouth={happy:'<path d="M47 68 q13 14 26 0z" fill="#7A1F40" stroke="#7A1F40" stroke-width="3.5" stroke-linejoin="round"/>',sad:'<path d="M47 76 q13 -12 26 0" fill="none" stroke="#7A1F40" stroke-width="4.5" stroke-linecap="round"/>',idle:'<path d="M49 70 q11 9 22 0" fill="none" stroke="#7A1F40" stroke-width="4.5" stroke-linecap="round"/>'}[m],dy=m=='sad'?3:0;
 return `<svg class="brain" viewBox="0 0 120 114" width="${w}" aria-hidden="true">${BODY}<g class="eyes"><circle cx="46" cy="54" r="9" fill="#fff"/><circle cx="74" cy="54" r="9" fill="#fff"/><circle cx="48" cy="${55+dy}" r="4.5" fill="#222"/><circle cx="72" cy="${55+dy}" r="4.5" fill="#222"/><circle cx="50" cy="${53+dy}" r="1.6" fill="#fff"/><circle cx="74" cy="${53+dy}" r="1.6" fill="#fff"/></g>${m=='happy'?'<circle cx="33" cy="66" r="5.5" fill="#FF5C8A" opacity=".45"/><circle cx="87" cy="66" r="5.5" fill="#FF5C8A" opacity=".45"/>':''}${mouth}</svg>`};

function confetti(){const c=document.getElementById('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const K=['#FFC83D','#FF5252','#35C46B','#3AA0FF','#fff','#B27CFF'];
 const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.38,vx:(Math.random()-.5)*16,vy:-Math.random()*15-3,r:Math.random()*7+5,c:K[Math.floor(Math.random()*K.length)],a:Math.random()*6}));let f=0;
 (function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=.25;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++f<100)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}
let ac;const tone=(f,t=.12,d=0)=>{try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+t)}catch(e){}};
const TH=[['Brain Valley','🌿','#4F8DFF','#2B4FD8','🍃','👒'],['Starlight Lab','🚀','#6A4DFF','#24146B','⭐','🪖'],['Coral Reef','🐠','#1FB6D4','#0B5FA8','🫧','🎩'],['Candy Land','🍭','#FF6FA5','#B83BA0','🍬','👑'],['Sunny Desert','🌵','#FFB03D','#E0572A','☀️','🧢'],['Frost Peak','❄️','#7FC8FF','#3A6BD6','❄️','🎓'],['Lava Cave','🌋','#FF6A3D','#8E1E2E','🔥','⛑️'],['Night City','🌃','#3B3F9E','#14163D','✨','🎩']];
const world=i=>TH[Math.floor(i/25)%8],wn=i=>Math.floor(i/25)+1;
function theme(i){const t=world(i),st=document.documentElement.style;st.setProperty('--bg',t[2]);st.setProperty('--bg2',t[3]);document.querySelectorAll('.bk').forEach(x=>x.remove());
 for(let k=0;k<10;k++){const d=document.createElement('div'),z=22+Math.random()*34;d.className='bk';d.textContent=t[4];d.style.cssText=`font-size:${z}px;left:${Math.random()*96}%;animation-duration:${12+Math.random()*14}s;animation-delay:-${Math.random()*20}s`;document.body.appendChild(d)}}
function enter(i){if(i%25==0&&st.intro!==i&&i<TOTAL){st.intro=i;clear();bg(i);const t=world(i);$.innerHTML=`<div class="hero" style="margin-top:20px"><div class="bob" style="position:relative">${brain('happy',150)}<span class="hat">${t[5]}</span></div></div><div class="logo" style="font-size:44px;transform:none;margin-top:34px">World ${wn(i)}</div><div class="logo" style="font-size:50px;transform:rotate(-2deg)">${t[1]} <span>${t[0]}</span></div><p class="sub">New puzzles ahead. Good luck!</p><button class="btn y" data-act="go" data-i="${i}">Start World ${wn(i)}</button>`}else play(i)}
let hp=null;
function clear(){clearInterval(st.t);clearInterval(hp);st.type=null;st.locked=false;MD.className=''}
function bg(i){theme(i)}
function home(){clear();bg(Math.min(done,TOTAL-1));const n=Math.min(done+1,TOTAL);
 $.innerHTML=`<svg class="hills" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70 Q80 20 170 60 T400 40 V120 H0Z" fill="rgba(255,255,255,.14)"/><path d="M0 92 Q100 52 200 86 T400 72 V120 H0Z" fill="rgba(0,0,0,.17)"/></svg><div class="hero"><svg class="rays" viewBox="-100 -100 200 200" aria-hidden="true">${Array.from({length:12},(_,i)=>`<path d="M0 0 L-13 -100 L13 -100Z" transform="rotate(${i*30})"/>`).join('')}</svg><div class="bob" style="position:relative">${brain('idle',160)}<span class="hat">${world(done)[5]}</span></div></div><div class="logo">Think<span>ora</span></div><p class="sub">Tricky puzzles that twist your thinking!</p>
 <div class="pills"><b>🪙 ${coins}</b><b>⭐ ${total()}</b><b>${world(done)[1]} World ${wn(done)}</b></div>
 <button class="btn y" data-act="play" data-i="${done>=TOTAL?0:done}">Play · Level ${n}</button><button class="btn w" data-act="levels">All levels</button>`}
let pg=0;function levels(p){clear();bg(0);if(p===undefined)p=Math.floor(Math.min(done,TOTAL-1)/PG);pg=Math.max(0,Math.min(TOTAL/PG-1,p));bg(pg*PG);
 $.innerHTML=`<div class="hd"><button class="round" data-act="home" aria-label="Back">←</button><div class="lvl">World ${pg+1}<small>${world(pg*PG)[1]} ${world(pg*PG)[0]} · ⭐ ${total()}</small></div><span style="width:50px"></span></div><div class="lg">${Array.from({length:PG},(_,k)=>{const i=pg*PG+k,c=i<done?'done':i==done?'now':'lock',s=stars[i]||0;return `<button class="lt ${c}" ${c=='lock'?'disabled':`data-act="play" data-i="${i}"`}>${c=='lock'?'🔒':i+1}${c=='done'?`<small>${'★'.repeat(s)}${'☆'.repeat(3-s)}</small>`:''}</button>`}).join('')}</div><div class="pg"><button class="round" data-act="pg" data-p="${pg-1}" aria-label="Previous page">‹</button><b>${pg*PG+1}–${pg*PG+PG}</b><button class="round" data-act="pg" data-p="${pg+1}" aria-label="Next page">›</button></div>`}
function play(i){clear();st.L=i;st.hinted=false;st.err=0;st.n=0;const v=st.v=lv(i);bg(i);st.type=v.type||'pick';
 let body='';
 if(v.type=='wait'){st.n=v.s||5;body=`<div class="big" id="cd">${st.n}</div>`;st.t=setInterval(()=>{if(--st.n<=0)return win();document.getElementById('cd').textContent=st.n},1000)}
 else if(v.type=='taps')body=`<div class="arena"><button class="tap" id="tp" data-act="tap">TAP!</button></div><div class="big" id="cd">0 / ${v.n}</div>`;
 else if(v.type=='hold')body='<div class="arena"><button class="tap" id="tp" data-hold="1" oncontextmenu="return false">HOLD</button></div>';
 else if(v.type=='mem'){st.n=v.m.length>4?5:3;st.mi=0;body=`<div class="mrow">${v.m.map(x=>`<span style="font-size:${v.m.length>4?36:52}px">${x}</span>`).join('')}</div><div class="big" id="cd">${st.n}</div><div id="mb"></div>`;
  st.t=setInterval(()=>{if(--st.n>0)return document.getElementById('cd').textContent=st.n;clearInterval(st.t);document.querySelector('.mrow').remove();document.getElementById('cd').remove();document.getElementById('hb').textContent='Tap them in the same order!';
   const o=[...v.m].sort(()=>Math.random()-.5);document.getElementById('mb').innerHTML=`<div class="opts">${o.map(x=>`<button class="opt" data-mem="${x}" style="font-size:50px">${x}</button>`).join('')}</div>`},1000)}
 else if(v.type=='simon'){st.phase='watch';st.mi=0;body=`<div class="big" id="cd" style="font-size:44px;margin-bottom:10px">Watch!</div><div class="pads">${['#FF4D6D','#3AA0FF','#35C46B','#FFC83D'].map((c,j)=>`<button class="pad" data-sim="${j}" style="background:${c}" aria-label="Pad ${j+1}"></button>`).join('')}</div>`;
 let k=0;const seq=v.m,fl=j=>{const el=document.querySelector(`[data-sim="${j}"]`);if(!el)return;el.classList.add('lit');tone(330+j*110,.25);setTimeout(()=>el.classList.remove('lit'),420)};
 setTimeout(()=>{st.t=setInterval(()=>{if(k>=seq.length){clearInterval(st.t);st.phase='in';const c=document.getElementById('cd');if(c)c.textContent='Your turn!';return}fl(seq[k++])},800)},900)}
 else if(v.type=='pairs'){st.open=[];st.found=0;st.busy=false;body=`<div class="cards">${v.m.map((x,j)=>`<button class="pc" data-card="${j}" aria-label="Card"><span>?</span></button>`).join('')}</div>`}
 else if(v.type=='order'){st.mi=0;const o=[...v.m].sort(()=>Math.random()-.5);body=`<div class="opts">${o.map(x=>`<button class="opt" data-mem="${x}" style="font-size:34px">${x}</button>`).join('')}</div>`}
 else if(v.type=='react'){st.go=false;body='<div class="arena"><button class="tap" id="tp" data-act="react" style="background:#9AA3C4;box-shadow:0 10px 0 #6B7399;color:#fff">WAIT</button></div>';st.t=setTimeout(()=>{const b=document.getElementById('tp');if(b){st.go=true;b.textContent='TAP!';b.style.background='radial-gradient(circle at 35% 28%,#7DFFB0,#35C46B)';b.style.boxShadow='0 10px 0 #1E9A4E'}},1500+Math.random()*2000)}
 else{const o=v.o.map(x=>typeof x=='string'?{t:x}:x);body=`${v.tm?'<div class="tbar"><i id="tb"></i></div>':''}<div class="opts ${o.some(x=>x.t.length>9&&x.t[0]!='<')?'one':''}">${o.map((x,j)=>`<button class="opt" data-pick="${j}" ${x.l?`aria-label="${x.l}"`:''} style="${x.s?`font-size:${x.s}px;`:''}${x.bg?`background:linear-gradient(rgba(255,255,255,.3),transparent 55%),${x.bg};box-shadow:0 7px 0 rgba(0,0,0,.3)`:''}">${x.t}</button>`).join('')}</div>`;
  if(v.tm)setTimeout(()=>{const b=document.getElementById('tb');if(b){b.style.transition=`width ${v.tm}s linear`;b.style.width='0'}},60),st.t=setTimeout(()=>fail('Time’s up!'),v.tm*1000+80)}
 $.innerHTML=`<div class="hd"><button class="round" data-act="levels" aria-label="Levels">←</button><div class="lvl">Level ${i+1}<small>${world(i)[1]} ${world(i)[0]} · 🪙 <span id="co">${coins}</span></small></div><button class="round" data-act="hint" aria-label="Hint">💡<span class="badge">10</span></button></div>
 <div class="card"><div class="peek" id="pk">${brain('idle',66)}</div><div class="stage">${v.e}</div><div class="q">${v.q}</div>${v.f?`<div class="fld">${v.f}</div>`:''}<div class="hintbox" id="hb"></div></div>${body}`;
 if(v.tm)setTimeout(()=>{const b=document.getElementById('tb');if(b){b.style.transition=`width ${v.tm}s linear`;b.style.width='0'}},80)}
function mood(m){const p=document.getElementById('pk');if(p){p.innerHTML=brain(m,66);setTimeout(()=>{const q=document.getElementById('pk');if(q)q.innerHTML=brain('idle',66)},900)}}
function hint(){const hb=document.getElementById('hb');if(st.hinted||st.locked)return;
 if(coins<10){coins+=20;hb.textContent='Demo: a rewarded video ad would play here. +20 coins!'}
 else{coins-=10;st.hinted=true;hb.textContent='💡 '+st.v.h}
 store('bt:coins',coins);document.getElementById('co').textContent=coins}
function modal(h,p,btn,act,m,extra=''){st.locked=true;clearInterval(st.t);clearInterval(hp);MD.className='on';
 MD.innerHTML=`<div class="card">${brain(m,120)}<h2 class="${m=='sad'?'sad':''}">${h}</h2>${extra}<p>${p}</p><button class="btn ${m=='sad'?'y':''}" data-act="${act}" style="margin-bottom:4px">${btn}</button></div>`}
function win(){if(st.locked)return;const L=st.L,last=L==TOTAL-1,s=Math.max(1,3-st.err-(st.hinted?1:0)),gain=Math.max(0,s-(stars[L]||0))*5;
 if(L>=done){done=L+1;store('bt:done',done)}stars[L]=Math.max(stars[L]||0,s);coins+=gain;store('bt:stars',stars);store('bt:coins',coins);
 const ex=`<div class="stars">${[1,2,3].map(i=>`<span class="${i<=s?'on':''}" style="animation-delay:${i*.18}s">★</span>`).join('')}</div>${gain?`<div class="gain">+${gain} 🪙</div>`:''}`;
 modal(['Brilliant!','Genius!','Nailed it!','Big brain!'][L%4],st.v.w,last?'All levels':'Next level',last?'levels':'next','happy',ex);confetti()}
function fail(msg){if(st.locked)return;modal('Oops!',msg,'Try again','retry','sad')}
function bad(b,msg){st.err++;b.classList.add('bad');b.disabled=true;mood('sad');const hb=document.getElementById('hb');hb.textContent=msg;hb.className='hintbox err'}

document.addEventListener('pointerdown',e=>{if(st.type!='hold'||st.locked||!e.target.closest('[data-hold]'))return;const b=document.getElementById('tp');let p=0;clearInterval(hp);
 hp=setInterval(()=>{p+=50/(1000*(st.v.hs||3));b.style.background=`conic-gradient(var(--g) ${p*100}%,var(--y) 0)`;if(p>=1){clearInterval(hp);win()}},50)});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{if(st.type!='hold'||st.locked)return;clearInterval(hp);const b=document.getElementById('tp');if(b)b.style.background=''}));
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act],[data-pick],[data-mem],[data-sim],[data-card]');
 if(st.type=='wait'&&!st.locked&&!(b&&['levels','hint'].includes(b.dataset.act)))return fail('You touched the screen!');
 if(!b||(st.locked&&!MD.contains(b)))return;
 const v=st.v;
 if(b.dataset.sim!==undefined){if(st.phase!='in'||st.locked)return;const j=+b.dataset.sim;b.classList.add('lit');tone(330+j*110,.2);setTimeout(()=>b.classList.remove('lit'),250);if(j==v.m[st.mi]){if(++st.mi>=v.m.length)win()}else fail('Wrong pad!');return}
 if(b.dataset.card!==undefined){if(st.busy||st.locked||b.classList.contains('open')||b.classList.contains('done'))return;const j=+b.dataset.card;b.classList.add('open');b.firstChild.textContent=v.m[j];st.open.push(j);
  if(st.open.length==2){const [x,y]=st.open,bs=document.querySelectorAll('.pc');st.busy=true;
   if(v.m[x]==v.m[y]){bs[x].className='pc done';bs[y].className='pc done';st.open=[];st.busy=false;st.found+=2;if(st.found>=v.m.length)win()}
   else{st.err++;mood('sad');setTimeout(()=>{[x,y].forEach(k=>{bs[k].className='pc';bs[k].firstChild.textContent='?'});st.open=[];st.busy=false},700)}}return}
 if(b.dataset.pick!==undefined){if(+b.dataset.pick==v.a)return win();return bad(b,'Not quite. Try again!')}
 if(b.dataset.mem!==undefined){if(b.dataset.mem==v.m[st.mi]){b.classList.add('got');b.disabled=true;b.insertAdjacentHTML('beforeend',`<i>${++st.mi}</i>`);if(st.mi>=v.m.length)win()}else fail('That’s not the right order!');return}
 const a=b.dataset.act;
 if(a=='play')enter(+b.dataset.i);else if(a=='go')play(+b.dataset.i);else if(a=='home')home();else if(a=='levels')levels();
 else if(a=='pg')levels(+b.dataset.p);else if(a=='react'){if(!st.go)return fail('Too early! Wait for green.');win()}else if(a=='next')enter(st.L+1);else if(a=='retry')play(st.L);else if(a=='hint')hint();
 else if(a=='tap'){st.n++;document.getElementById('cd').textContent=st.n+' / '+v.n;if(st.n>=v.n)return win();
  if(v.move){const ar=document.querySelector('.arena');b.style.left=Math.random()*(ar.clientWidth-180)+'px';b.style.top=Math.random()*(ar.clientHeight-180)+'px'}}});
home();
</script>
</body>
